<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bro · 简易搜索</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">bro</span>
      <span class="brand-sub">本地静默搜索 / AI 面板</span>
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="search">搜索</button>
      <button class="tab" data-view="kimi">Kimi</button>
      <button class="tab" data-view="deepseek">DeepSeek</button>
    </nav>
    <div class="conn">
      <span id="connDot" class="dot off"></span>
      <span id="connText">未连接本机服务</span>
      <button id="settingsBtn" class="ghost" title="设置本机服务地址">设置</button>
    </div>
  </header>

  <main>
    <!-- 搜索视图 -->
    <section id="view-search" class="view active">
      <div class="hero">
        <h1 class="hero-title">搜索</h1>
        <form id="searchForm" class="searchbar">
          <div class="engine" id="engineBox">
            <button type="button" class="engine-btn" id="engineBtn">
              <img id="engineIcon" class="engine-fav" alt="" />
              <span id="engineLabel">Bing</span>
              <span class="caret"></span>
            </button>
            <div class="engine-menu" id="engineMenu"></div>
          </div>
          <input id="searchInput" class="search-input" type="text" placeholder="输入搜索内容" autocomplete="off" />
          <div class="mode" id="modeSwitch">
            <button type="button" class="mode-btn active" data-mode="web">网页</button>
            <button type="button" class="mode-btn" data-mode="image">图片</button>
          </div>
          <button type="submit" class="search-submit">搜索</button>
        </form>
        <div class="hero-hint">结果由本机服务静默抓取后返回，点击结果才会跳转到目标网页。</div>
      </div>

      <div id="searchStatus" class="status"></div>
      <div id="results" class="results"></div>
      <div id="pager" class="pager"></div>
    </section>

    <!-- Kimi 视图 -->
    <section id="view-kimi" class="view"></section>
    <!-- DeepSeek 视图 -->
    <section id="view-deepseek" class="view"></section>
  </main>

  <footer class="foot">
    <span>本地运行，不经过任何远程服务器；登录信息仅用于本机向目标站点登录。</span>
  </footer>

  <!-- 设置弹层 -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <h3>本机服务地址</h3>
      <p class="muted">默认 <code>http://127.0.0.1:8787</code>，如修改过端口请在此同步。</p>
      <input id="baseInput" class="text" type="text" placeholder="http://127.0.0.1:8787" />
      <div class="modal-actions">
        <button id="baseCancel" class="ghost">取消</button>
        <button id="baseSave" class="primary">保存</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
